<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolHub Teacher</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182230}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin:14px 0}input,button{padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}button{background:#2563eb;color:#fff;border:0;font-weight:700;cursor:pointer}.code{font-size:34px;font-weight:800;letter-spacing:5px}.pin{font-size:28px;font-weight:800;letter-spacing:4px}.muted{color:#667085}</style></head><body><main class="wrap"><h1>👩‍🏫 Teacher Dashboard</h1><div class="card"><h2>➕ Create a class</h2><input id="name" placeholder="Class name"><button onclick="createClass()">Create Class</button></div><div id="result"></div><div class="card"><h2>📚 Learning Store</h2><p class="muted">Find resources and recommend them to your classes.</p><a href="../">Open Learning Store</a></div></main><script>function digits(n){return Math.floor(Math.random()*(10**n)).toString().padStart(n,'0')}function createClass(){const name=document.getElementById('name').value.trim()||'New Class';const code=digits(4),pin=digits(4);localStorage.setItem('schoolhubTeacherClass',JSON.stringify({name,code,pin}));result.innerHTML=`<div class="card"><h2>✅ ${name} is ready!</h2><p>Tell your students these codes:</p><p>Class Code</p><div class="code">${code}</div><p>Teacher Join PIN</p><div class="pin">${pin}</div><p class="muted">SchoolHub generated both codes automatically. Never ask students to invent the PIN.</p><button onclick="regenerate()">🔄 Generate New PIN</button></div>`}function regenerate(){const x=JSON.parse(localStorage.getItem('schoolhubTeacherClass'));if(!x)return; x.pin=digits(4);localStorage.setItem('schoolhubTeacherClass',JSON.stringify(x));createClass();}const x=JSON.parse(localStorage.getItem('schoolhubTeacherClass')||'null');if(x){name.value=x.name;result.innerHTML=`<div class="card"><h2>🏫 ${x.name}</h2><p>Class Code</p><div class="code">${x.code}</div><p>Teacher Join PIN</p><div class="pin">${x.pin}</div><button onclick="regenerate()">🔄 Generate New PIN</button></div>`}</script></body></html>
