<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolHub Student Login</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182230;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:28px;border-radius:20px;box-shadow:0 10px 35px #0001;width:min(420px,90vw)}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-size:16px}button{background:#2563eb;color:white;border:0;font-weight:700;cursor:pointer}.muted{color:#667085;font-size:14px}h1{margin-top:0}</style></head><body><main class="box"><h1>👨‍🎓 Student Login</h1><p class="muted">Enter the class code and teacher-generated PIN your teacher gave you.</p><form id="form"><label>Class code</label><input id="code" inputmode="numeric" maxlength="8" placeholder="7789" required><label>Teacher PIN</label><input id="pin" inputmode="numeric" maxlength="8" placeholder="4826" required><label>Your student password</label><input id="password" type="password" placeholder="Your password" required><button>Log in</button></form><p id="msg" class="muted"></p></main><script>form.onsubmit=e=>{e.preventDefault();localStorage.setItem('schoolhubStudentClass',code.value);location.href='../index.html'}</script></body></html>
